# Lets Clawblox start the GraphysX world service as an external world:
#   clawblox run /home/yb/codes/<GraphysX-Web checkout>/world-service
# Clawblox passes WORLD_HOST / WORLD_PORT / WORLD_RECORD / WORLD_RECORD_DIR /
# WORLD_RESUME_PATH / WORLD_OPERATOR_TOKEN; main.mjs reads them.
# Build first: npm run build:world-service
name = "Mesa island (GraphysX)"
description = "The Clawblox Mesa island simulated headless by the GraphysX scene runtime."

[run]
command = ["node", "main.mjs"]

[scripts]
# Clawblox's parser requires `main` even when [run].command delegates startup; unused here.
main = "main.mjs"
api = "API.md"

[observation]
radius = 40000

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLMx face embed</title>
  <!-- Dev-only harness for <llmx-face>, like llmx-preview.html: not a build input. -->
  <style>
    body { margin: 0; background: #0b1016; color: #d7e3ee; font: 14px system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    .dock { background: radial-gradient(circle at 50% 40%, #16202b, #0b1016 70%); border: 1px solid #253241; border-radius: 16px; overflow: hidden; }
    .quarter { height: 360px; } .bubble { width: 96px; height: 96px; border-radius: 50%; }
    llmx-face { width: 100%; height: 100%; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; }
    button { background: #16202b; color: inherit; border: 1px solid #2c3b4c; border-radius: 8px; padding: 6px 10px; }
  </style>
</head>
<body>
  <nav id="controls"></nav>
  <main>
    <div class="dock quarter"><llmx-face id="face"></llmx-face></div>
    <div><div class="dock bubble"><llmx-face id="small" level="mobile" tint="#f0b35a" intro="off"></llmx-face></div></div>
  </main>
  <script type="module">
    import "/src/llmx-face-element.ts";
    const faces = [document.getElementById("face"), document.getElementById("small")];
    let phase = "idle", pulses = 0;
    const set = patch => faces.forEach(face => { face.presence = patch; });
    const nav = document.getElementById("controls");
    for (const name of ["idle", "listening", "waiting", "generating", "speaking", "error", "sleeping"]) {
      const button = document.createElement("button");
      button.textContent = name;
      button.onclick = () => { phase = name; set({ phase }); };
      nav.append(button);
    }
    const tool = document.createElement("button");
    tool.textContent = "tool spark";
    tool.onclick = () => set({ toolPulses: ++pulses });
    const rebuild = document.createElement("button");
    rebuild.textContent = "rebuild";
    rebuild.onclick = () => faces.forEach(face => face.rebuild());
    nav.append(tool, rebuild);
    // Simulated voice and token stream, so each phase can be judged without a conversation.
    setInterval(() => {
      const t = performance.now() / 1000;
      const syllable = Math.max(0, Math.sin(t * 11) * Math.sin(t * 2.3));
      if (phase === "speaking") set({ level: 0.02 + syllable * 0.1, brightness: 0.1 });
      else if (phase === "listening") set({ level: 0.03 * Math.abs(Math.sin(t * 5)) });
      else if (phase === "generating") set({ tokenRate: 20 + 20 * Math.sin(t) });
      else set({ level: 0 });
    }, 50);
  </script>
</body>
</html>

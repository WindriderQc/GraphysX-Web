name: CI

on:
  pull_request:
  # Pull requests validate branch updates; main calls this workflow from deploy.yml.
  # A separate branch-push trigger duplicated the PR gate for the same revision.
  workflow_call:
    inputs:
      full_verify:
        type: boolean
        default: false
    outputs:
      deployment_required:
        value: ${{ jobs.verify.outputs.deploy }}
  workflow_dispatch:
    inputs:
      full_verify:
        description: Check all Node contracts and list the full local visual plan
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  # On a PR branch, a newer push makes the old gate moot — cancel it. On main this
  # workflow is the deploy gate (called from deploy.yml), and a push must never cancel
  # the in-flight gate of the previous push: that gate is the only thing that would have
  # surfaced a broken main, and rapid pushes were killing it before it could go red.
  # Observed: four consecutive main pushes, zero completed gates, production stuck on a
  # commit from the day before while everyone believed newer work had shipped.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck, build and Node checks
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Plan verification from changed files
        id: impact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_FULL: ${{ inputs.full_verify }}
        run: node scripts/plan-verification.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        env:
          VERIFY_CHECKS: ${{ steps.impact.outputs.checks }}
        run: npm run verify -- "--checks=$VERIFY_CHECKS"

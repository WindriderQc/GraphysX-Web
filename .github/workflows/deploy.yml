name: Deploy GraphysX Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: graphysx-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Production is gated: typecheck, build, and the headless smokes across every product
  # route must pass before anything is shipped to graphysx.specialblend.ca.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pre-deploy reusable gate proves the build in isolation. This browser is for the
      # separate post-activation proof against the public hostname.
      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Build production release
        env:
          VITE_GRAPHYSX_STORE_URL: ${{ vars.GRAPHYSX_STORE_URL }}
        run: npm run build

      - name: Stamp release identity
        env:
          GRAPHYSX_RELEASE_SHA: ${{ github.sha }}
          GRAPHYSX_RELEASE_RUN_ID: ${{ github.run_id }}
        run: node scripts/write-release-metadata.mjs

      - name: Package release
        run: tar -czf "graphysx-${GITHUB_SHA}.tgz" -C dist .

      # The store server is not part of dist/. Until this step existed, a change under
      # server/ could be merged, deployed and green while production kept executing the old
      # code — which is exactly how a loopback-bind fix sat in main looking shipped while the
      # running store was still listening on every interface.
      #
      # The whole server tree has zero third-party imports (checked: every import is either
      # node: or relative), so this needs no npm install on the host.
      - name: Package the store server
        run: |
          tar -czf "graphysx-server-${GITHUB_SHA}.tgz" server package.json
          sha256sum "graphysx-server-${GITHUB_SHA}.tgz" | cut -d' ' -f1 > server-checksum.txt

      - name: Upload release
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "graphysx-${{ github.sha }}.tgz,graphysx-server-${{ github.sha }}.tgz,server-checksum.txt"
          target: /var/www/html/graphysx/incoming
          overwrite: true
          timeout: 120s
          command_timeout: 30m

      # Deliberately BEFORE activation: if the store cannot be updated, nothing should be
      # swapped. A half-deployed pair — new bundle, old server — is the state this whole step
      # exists to prevent.
      #
      # Restarts only when the code actually changed. Sessions are in-memory, so every restart
      # drops everyone collaborating; paying that on a deploy that did not touch server/ would
      # teach people the feature is flaky.
      #
      # Requires, once, on the host:
      #   %deploy ALL=(root) NOPASSWD: /bin/systemctl restart graphysx-store
      # A box with no graphysx-store unit skips the restart and says so rather than failing.
      - name: Sync the store server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            store_dir="${GRAPHYSX_STORE_PATH:-/opt/graphysx-web}"
            incoming=/var/www/html/graphysx/incoming
            sha='${{ github.sha }}'
            archive="$incoming/graphysx-server-$sha.tgz"
            test -f "$archive"

            if ! test -d "$store_dir"; then
              echo "No store directory at $store_dir — skipping server sync."
              rm -f -- "$archive" "$incoming/server-checksum.txt"
              exit 0
            fi

            new_checksum="$(cat "$incoming/server-checksum.txt")"
            old_checksum="$(cat "$store_dir/.server-checksum" 2>/dev/null || echo none)"

            if test "$new_checksum" = "$old_checksum"; then
              echo "Store server unchanged ($new_checksum) — not restarting, so live sessions survive."
              rm -f -- "$archive" "$incoming/server-checksum.txt"
              exit 0
            fi

            echo "Store server changed: $old_checksum -> $new_checksum"
            tar -xzf "$archive" -C "$store_dir"
            echo "$new_checksum" > "$store_dir/.server-checksum"
            rm -f -- "$archive" "$incoming/server-checksum.txt"

            if systemctl list-unit-files | grep -q '^graphysx-store\.service'; then
              sudo -n systemctl restart graphysx-store
              # Give it a moment to bind, then prove it came back rather than assuming.
              sleep 2
              systemctl is-active --quiet graphysx-store
              echo "graphysx-store restarted and active."
              # The one thing the remote preflight structurally cannot see.
              ss -tlnp 2>/dev/null | grep ":8788" || echo "(no listener on 8788 — check the unit)"
            else
              echo "No graphysx-store unit on this host; code updated, nothing to restart."
            fi

      - name: Activate release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            base=/var/www/html/graphysx
            sha='${{ github.sha }}'
            case "$sha" in
              *[!0-9a-f]*|'') echo 'Invalid release SHA' >&2; exit 1 ;;
            esac
            archive="$base/incoming/graphysx-$sha.tgz"
            releases="$base/releases"
            staging="$releases/.staging-$sha"
            release="$releases/$sha"
            previous_target="$(readlink "$base/current" 2>/dev/null || true)"
            test -f "$archive"
            mkdir -p "$releases"
            rm -rf -- "$staging"
            mkdir -p "$staging"
            tar -xzf "$archive" -C "$staging"
            test -f "$staging/index.html"
            rm -rf -- "$release"
            mv -- "$staging" "$release"
            ln -sfn "releases/$sha" "$base/current.next"
            mv -Tf "$base/current.next" "$base/current"
            # Keep a validated rollback pointer before retention removes old releases. The
            # public smoke below is the authority on whether this activation stays live.
            previous_sha="${previous_target#releases/}"
            if test "$previous_target" = "releases/$previous_sha"; then
              case "$previous_sha" in
                *[!0-9a-f]*|'') ;;
                *)
                  if test -d "$base/$previous_target"; then
                    # Retention sorts by directory mtime. Mark the actual rollback target as
                    # recently relevant so a manual older-release activation cannot prune it.
                    touch -- "$base/$previous_target"
                    ln -sfn "$previous_target" "$base/previous.next"
                    mv -Tf "$base/previous.next" "$base/previous"
                  fi
                  ;;
              esac
            fi
            rm -f -- "$archive"
            find "$releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\0' \
              | sort -z -nr \
              | tail -z -n +3 \
              | cut -z -d ' ' -f 2- \
              | xargs -0r rm -rf --

      - name: Smoke the activated production release
        id: live-smoke
        timeout-minutes: 5
        env:
          SMOKE_BASE: https://graphysx.specialblend.ca/
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          SMOKE_ARTIFACTS: output/production-smoke
        run: npm run smoke:live-release

      - name: Roll back a failed production activation
        if: ${{ failure() && steps.live-smoke.outcome == 'failure' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            base=/var/www/html/graphysx
            target="$(readlink "$base/previous" 2>/dev/null || true)"
            rollback_sha="${target#releases/}"
            test "$target" = "releases/$rollback_sha"
            case "$rollback_sha" in
              *[!0-9a-f]*|'') echo 'No valid previous release to roll back to' >&2; exit 1 ;;
            esac
            test -d "$base/$target"
            ln -sfn "$target" "$base/current.rollback"
            mv -Tf "$base/current.rollback" "$base/current"
            echo "Rolled production back to $rollback_sha"

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-${{ github.sha }}
          path: output/production-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Record production verification
        if: steps.live-smoke.outcome == 'success'
        run: |
          echo '### Production verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit `${{ github.sha }}` is live at <https://graphysx.specialblend.ca/>.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The revision manifest matched and the Great Slide canary completed.' >> "$GITHUB_STEP_SUMMARY"
